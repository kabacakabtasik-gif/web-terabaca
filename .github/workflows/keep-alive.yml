name: Supabase Keep-Alive Cron

on:
  schedule:
    # Berjalan otomatis setiap 2 hari sekali pada jam 04:00 UTC (11:00 WIB)
    - cron: '0 4 */2 * *'
  workflow_dispatch: # Bisa juga dipicu secara manual dari tab Actions GitHub

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        run: |
          echo "Pinging Terabaca Keep-Alive endpoint..."
          curl -s -f https://web-terabaca.vercel.app/api/keep-alive || echo "Ping request executed"