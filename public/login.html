<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Cabang - TeraBaca</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-8">
    <div class="text-center mb-6">
      <img src="logo-terabaca.png" alt="TeraBaca Logo" class="h-12 mx-auto mb-3 error-fallback">
      <h1 class="text-2xl font-bold text-slate-900">Login Cabang</h1>
      <p class="text-xs text-slate-500 mt-1">Masukkan akun cabang Anda untuk melanjutkan</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email / Username Cabang</label>
        <input type="text" id="username" required placeholder="Masukkan email atau username" class="w-full text-sm border rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required placeholder="Masukkan password" class="w-full text-sm border rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <button type="submit" id="btn-submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg text-sm transition">
        Masuk
      </button>
    </form>
  </div>

  <!-- Menghubungkan ke script login frontend utama -->
  <script src="login.js"></script>
</body>
</html>
