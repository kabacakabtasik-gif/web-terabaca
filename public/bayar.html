<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Online - TERABACA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="Mid-client-2-2L5XUm_r2zrd6p"></script>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' https://app.sandbox.midtrans.com https://app.midtrans.com https://snap-assets.sandbox.midtrans.com https://api.sandbox.midtrans.com https://pay.google.com https://gwk.gopayapi.com;">
    <!-- Link Manifest PWA -->
    <link rel="manifest" href="/manifest.json">

    <!-- Link Icon Browser & PWA -->
    <link rel="icon" type="image/png" href="/logo-terabaca.png">
    <link rel="apple-touch-icon" href="/logo-terabaca.png">
</head>
<body class="bg-slate-50 min-h-screen font-sans flex flex-col justify-between">

    <!-- HEADER (Responsif + Tombol Kembalikan/Dashboard) -->
    <header class="bg-white shadow-sm py-3 px-4 sm:px-6 border-b border-slate-100 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
            <span class="font-bold text-xl sm:text-2xl text-emerald-700 tracking-wide">TERABACA</span>
            
            <div class="flex items-center gap-2 sm:gap-3">
                <span class="hidden md:inline-block text-xs bg-emerald-100 text-emerald-800 font-semibold px-3 py-1 rounded-full">
                    Portal Pembayaran Resmi
                </span>
                
                <!-- Tombol Navigasi Keluar / Kembali -->
                <button type="button" onclick="goBackOrDashboard()" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 text-xs font-semibold rounded-lg transition">
                    ⬅️ <span class="hidden sm:inline">Kembali</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT (Mobile Friendly) -->
    <main class="max-w-xl mx-auto p-3 sm:p-6 w-full flex-grow flex items-center justify-center">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-8 space-y-6 w-full">
            
            <div class="text-center space-y-1">
                <h1 class="text-lg sm:text-xl font-bold text-slate-800">Form Pembayaran Tes</h1>
                <p class="text-xs text-slate-500">Silakan lengkapi data untuk memproses pembayaran via Midtrans</p>
            </div>

            <!-- Form Pembayaran -->
            <form id="paymentForm" class="space-y-4">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Pembayar / Orang Tua *</label>
                    <input type="text" id="pay_nama" required class="w-full px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" placeholder="Masukkan nama lengkap">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Email *</label>
                        <input type="email" id="pay_email" required class="w-full px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" placeholder="email@contoh.com">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">No WhatsApp *</label>
                        <input type="tel" id="pay_phone" required class="w-full px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" placeholder="08xxxxxxxxxx">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Cabang *</label>
                        <select id="pay_cabang" required class="w-full px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none transition bg-white">
                            <option value="">-- Pilih Cabang --</option>
                            <option value="Kab. Tasikmalaya">Kab. Tasikmalaya</option>
                            <option value="Kota Depok">Kota Depok</option>
                            <option value="Pusat">Pusat</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Paket Tes *</label>
                        <select id="pay_paket" required class="w-full px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none transition bg-white">
                            <option value="">-- Pilih Paket --</option>
                            <option value="BASIC" data-harga="350000">Paket 01 - BASIC (Rp 350.000)</option>
                            <option value="PARENT" data-harga="350000">Paket 02 - PARENT (Rp 350.000)</option>
                            <option value="TALENT" data-harga="600000">Paket 03 - TALENT (Rp 600.000)</option>
                            <option value="BRAINWAVE" data-harga="14000000">Paket 04 - BRAINWAVE (Rp 14.000.000)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="btnPay" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-semibold py-3 rounded-xl transition shadow-md text-sm mt-2">
                    Lanjut ke Pembayaran Online (Midtrans)
                </button>
            </form>

        </div>
    </main>

    <script>
        // Fungsi Navigasi Pintar
        function goBackOrDashboard() {
            const userSession = sessionStorage.getItem('user_session') || localStorage.getItem('userBranchCode');
            
            if (userSession) {
                // Jika user dalam keadaan terautentikasi (Cabang/Admin)
                window.location.href = 'admin_cabang.html';
            } else if (document.referrer && !document.referrer.includes(window.location.pathname)) {
                // Jika datang dari halaman sebelumnya
                window.history.back();
            } else {
                // Default lempar ke landing page
                window.location.href = 'index.html';
            }
        }

        // Event Listener Payment Form
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnPay');
            btn.disabled = true;
            btn.textContent = 'Memproses Transaksi...';

            const selectPaket = document.getElementById('pay_paket');
            const nominal = selectPaket.options[selectPaket.selectedIndex].getAttribute('data-harga');

            const payload = {
                nama: document.getElementById('pay_nama').value,
                email: document.getElementById('pay_email').value,
                phone: document.getElementById('pay_phone').value,
                cabang: document.getElementById('pay_cabang').value,
                paket: selectPaket.value,
                nominal: nominal
            };

            try {
                const res = await fetch('/api/create-transaction', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (data.token) {
                    window.snap.pay(data.token, {
                        onSuccess: function(result) {
                            alert('Alhamdulillah! Pembayaran Berhasil.');
                            sessionStorage.setItem('isPaidTERABACA', 'true');
                            sessionStorage.setItem('orderIdTERABACA', data.orderId);
                            window.location.href = '/pendaftaran.html';
                        },
                        onPending: function(result) {
                            alert('Menunggu pembayaran diselesaikan.');
                        },
                        onError: function(result) {
                            alert('Pembayaran gagal, silakan coba lagi.');
                        },
                        onClose: function() {
                            btn.disabled = false;
                            btn.textContent = 'Lanjut ke Pembayaran Online (Midtrans)';
                        }
                    });
                } else {
                    throw new Error(data.message || 'Gagal mendapatkan token transaksi.');
                }
            } catch (err) {
                alert('Terjadi kesalahan: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Lanjut ke Pembayaran Online (Midtrans)';
            }
        });
    </script>
</body>
</html>
